name: CI/CD - Secure API

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./app
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set deployment target
        id: vars
        run: |
          if [ "${GITHUB_REF##*/}" = "develop" ]; then
            echo "SERVICE_NAME=secure-api-dev" >> $GITHUB_ENV
          else
            echo "SERVICE_NAME=secure-api" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --add-cloudsql-instances=devsecops-494123:us-central1:secure-api-db \
            --set-env-vars="DB_USER=apiuser,DB_NAME=securedb,INSTANCE_CONNECTION_NAME=devsecops-494123:us-central1:secure-api-db" \
            --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest"